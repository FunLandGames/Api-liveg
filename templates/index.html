<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Chatbot 🤖</title>
    <style>
        body { font-family: Arial, sans-serif; background:#111; color:#eee; display:flex; flex-direction:column; align-items:center; padding:20px;}
        #chatbox { width:100%; max-width:400px; height:400px; border:1px solid #444; overflow-y:auto; padding:10px; margin-bottom:10px; background:#222; }
        #user-input { width:80%; padding:10px; }
        #send-btn { padding:10px; }
        .user { color: #4ee; }
        .bot { color: #fe4; }
    </style>
</head>
<body>
    <h2>Smart AI Chatbot 🤖</h2>
    <div id="chatbox"></div>
    <input type="text" id="user-input" placeholder="Type message...">
    <button id="send-btn">Send</button>

    <script>
        const chatbox = document.getElementById("chatbox");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        function appendMessage(sender, msg) {
            const p = document.createElement("p");
            p.className = sender;
            p.textContent = sender === "user" ? "You: " + msg : "AI: " + msg;
            chatbox.appendChild(p);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            appendMessage("user", message);
            userInput.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({message})
                });
                const data = await response.json();
                appendMessage("bot", data.reply);
            } catch(e) {
                appendMessage("bot", "Error connecting to server!");
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keydown", e => { if(e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
